<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Painel de Treinamentos Riva Stones</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-icone.png">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo-wrap"><img src="/img/logo-vertical.png" alt="Riva Stones"></div>
    <h1>Painel de Treinamentos Normativos</h1>
    <p class="sub">Riva Stones · Mineração Vista Linda · Granriva Granitos · Ágape Distribuição</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn-primary" type="submit">Entrar</button>
      <div class="login-error" id="err"></div>
    </form>

    <div class="acesso-gestor" id="blocoGestor" style="display:none">
      <div class="ou"><span>ou</span></div>
      <button class="btn-gestor" id="btnGestor">
        <span class="ico">📊</span>
        <span>
          <b>Acesso do Gestor</b>
          <small>ver os indicadores sem precisar de senha</small>
        </span>
      </button>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value })
      });
      if (res.ok) { location.href = '/'; }
      else {
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || 'Falha no login';
        err.style.display = 'block';
      }
    });

    // O botão do gestor só aparece se a administradora mantiver o acesso liberado.
    (async () => {
      try {
        const r = await fetch('/api/acesso-gestor');
        const d = await r.json();
        if (d.liberado) document.getElementById('blocoGestor').style.display = 'block';
      } catch { /* sem conexão: fica só o login */ }
    })();

    document.getElementById('btnGestor').addEventListener('click', async () => {
      const btn = document.getElementById('btnGestor');
      btn.disabled = true;
      const res = await fetch('/api/acesso-gestor', { method: 'POST' });
      if (res.ok) { location.href = '/'; return; }
      btn.disabled = false;
      const err = document.getElementById('err');
      err.textContent = (await res.json().catch(() => ({}))).error || 'Acesso indisponível';
      err.style.display = 'block';
    });
  </script>
</body>
</html>
