<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Gestão à Vista Riva Stones</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-icone.png">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo-wrap logo-float"><img src="/img/logo-vertical.png" alt="Riva Stones"></div>
    <h1>Gestão à Vista</h1>

    <!-- Único caminho de entrada: e-mail e senha. Não existe acesso sem login. -->
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn-primary" type="submit">Entrar</button>
      <button type="button" class="link-esqueci" id="btnEsqueci">Esqueci minha senha</button>
    </form>

    <!-- Recuperação de senha da administradora, com código gerado por ela mesma -->
    <form id="recuperarForm" style="display:none">
      <button type="button" class="voltar" id="btnVoltarRecuperar">← Voltar</button>
      <p class="sub" style="text-align:left;margin:0 0 14px">
        Disponível só para a conta administradora, com o código de recuperação
        gerado por ela na tela de Senha.</p>
      <label for="recEmail">E-mail</label>
      <input type="email" id="recEmail" autocomplete="username" required>
      <label for="recCodigo">Código de recuperação</label>
      <input type="text" id="recCodigo" placeholder="RIVA-XXXX-XXXX-XXXX" required>
      <label for="recSenha">Nova senha (mínimo 6 caracteres)</label>
      <input type="password" id="recSenha" autocomplete="new-password" required>
      <button class="btn-primary" type="submit">Redefinir senha</button>
    </form>

    <div class="login-error" id="err"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const recuperarForm = document.getElementById('recuperarForm');
    const err = document.getElementById('err');

    function mostrarErro(msg) { err.textContent = msg; err.classList.remove('sucesso'); err.style.display = 'block'; }
    function mostrarSucesso(msg) { err.textContent = msg; err.classList.add('sucesso'); err.style.display = 'block'; }
    function limparErro() { err.style.display = 'none'; err.classList.remove('sucesso'); }

    document.getElementById('btnEsqueci').addEventListener('click', () => {
      limparErro();
      form.style.display = 'none';
      recuperarForm.style.display = 'block';
      setTimeout(() => document.getElementById('recEmail').focus(), 60);
    });

    document.getElementById('btnVoltarRecuperar').addEventListener('click', () => {
      limparErro();
      recuperarForm.style.display = 'none';
      form.style.display = 'block';
    });

    recuperarForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      limparErro();
      const res = await fetch('/api/recuperar-senha', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('recEmail').value,
          codigo: document.getElementById('recCodigo').value,
          novaSenha: document.getElementById('recSenha').value,
        })
      });
      if (res.ok) {
        recuperarForm.style.display = 'none';
        form.style.display = 'block';
        mostrarSucesso('Senha redefinida. Entre com a nova senha.');
        return;
      }
      mostrarErro((await res.json().catch(() => ({}))).error || 'Não foi possível redefinir a senha');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limparErro();
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value })
      });
      if (res.ok) { location.href = '/'; return; }
      mostrarErro((await res.json().catch(() => ({}))).error || 'Falha no login');
    });
  </script>
</body>
</html>
