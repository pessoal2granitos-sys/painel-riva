<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão à Vista — Riva Stones</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-icone.png">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-chip"><img class="logo" src="/img/logo.png" alt="Riva Stones"></span>
        <h1>Gestão à Vista</h1>
      </div>

      <nav id="mainTabs">
        <div class="nav-group">
          <div class="nav-group-label">Comunicação</div>
          <button data-tab="avisos" data-perm="avisos">📣 Mural<span class="badge-novos" id="badgeAvisos" style="display:none"></span></button>
          <button data-tab="tv" data-perm="tv">📺 TV Corporativa</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Indicadores</div>
          <button data-tab="visao" data-perm="visao" class="active">📊 Visão Geral</button>
          <button data-tab="vencimentos" data-perm="vencimentos">⏳ Vencimentos</button>
          <button data-tab="realizados" data-perm="realizados">✅ Realizados</button>
          <button data-tab="pendencias" data-perm="pendencias">⚠ Pendências e Atenção</button>
          <button data-tab="cargos" data-perm="cargos">🏷 Cargos e Empresas</button>
          <button data-tab="custo" data-perm="custo">💰 Carga Horária e Custo</button>
          <button data-tab="qualidade" data-perm="qualidade">🔍 Qualidade dos Dados</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Sistema</div>
          <button data-tab="admin" class="tab-admin">⚙ Administração</button>
        </div>
      </nav>

      <div class="sidebar-user">
        <div class="user-chip">
          <div class="avatar" id="userAvatar"></div>
          <div>
            <div id="userName" style="font-weight:600;color:#fff"></div>
            <div id="userRole" style="font-size:11px"></div>
          </div>
        </div>
        <div class="sidebar-user-actions">
          <button id="btnMyPassword" title="Trocar minha senha">Senha</button>
          <button id="btnLogout">Sair</button>
        </div>
      </div>
    </aside>

  <main>
    <div class="content-info" id="headerSub">Carregando…</div>
    <!-- Filtros (abas de indicadores) -->
    <div class="filters" id="filterBar">
      <div class="f"><label>Empresa</label><select id="fEmpresa"><option value="">Todas</option></select></div>
      <div class="f"><label>Cargo</label><select id="fCargo"><option value="">Todos</option></select></div>
      <div class="f"><label>Treinamento</label><select id="fTreinamento"><option value="">Todos</option></select></div>
      <div class="f"><label>Situação</label>
        <select id="fSituacao">
          <option value="">Todas</option>
          <option>VÁLIDO</option><option>PENDENTE</option><option>VENCIDO</option>
        </select>
      </div>
      <div class="f"><label>Faixa de vencimento</label>
        <select id="fFaixa">
          <option value="">Todas</option>
          <option value="vencido">Vencido</option>
          <option value="pendente">Pendente</option>
          <option value="30">Até 30 dias</option>
          <option value="60">31 a 60 dias</option>
          <option value="90">61 a 90 dias</option>
          <option value="90+">Acima de 90 dias</option>
        </select>
      </div>
      <div class="f"><label>Buscar colaborador</label><input type="text" id="fBusca" placeholder="digite parte do nome"></div>
      <div class="f" style="min-width:230px"><label>O que contar nos indicadores</label>
        <select id="fEscopo" title="Define o que entra nos números dos painéis">
          <option value="trilha">Somente a trilha do cargo</option>
          <option value="individual">Trilha + exigências individuais</option>
          <option value="tudo">Tudo, inclusive avulsos</option>
        </select></div>
      <button class="btn-navy" id="btnLimpar">Limpar filtros</button>
      <button class="btn-primary" id="btnAtualizar" title="Buscar os lançamentos mais recentes">⟳ Atualizar</button>
    </div>
    <div id="avisoEscopo" class="escopo-bar" style="display:none"></div>
    <div id="avisoDesatualizado" class="stale-bar" style="display:none">
      <span>Há lançamentos mais recentes do que o que está na tela.</span>
      <button class="btn-mini" id="btnAtualizarAviso">Atualizar agora</button>
    </div>

    <section id="tab-avisos" style="display:none"></section>
    <section id="tab-visao"></section>
    <section id="tab-vencimentos" style="display:none"></section>
    <section id="tab-realizados" style="display:none"></section>
    <section id="tab-pendencias" style="display:none"></section>
    <section id="tab-cargos" style="display:none"></section>
    <section id="tab-custo" style="display:none"></section>
    <section id="tab-qualidade" style="display:none"></section>
    <section id="tab-tv" style="display:none"></section>
    <section id="tab-admin" style="display:none"></section>
  </main>
  </div>

  <div class="modal-back" id="modalBack">
    <div class="modal">
      <div class="m-head"><h3 id="modalTitle"></h3><button id="modalClose">×</button></div>
      <div class="m-body" id="modalBody"></div>
      <div class="m-foot" id="modalFoot"></div>
    </div>
  </div>
  <!-- Confirmação própria: a nativa do navegador pode ser silenciada pelo usuário
       sem ele perceber, e aí os botões de exclusão parecem simplesmente não funcionar. -->
  <div class="modal-back" id="confirmBack" style="z-index:150">
    <div class="modal" style="width:420px">
      <div class="m-head"><h3 id="confirmTitle">Confirmar</h3></div>
      <div class="m-body"><p id="confirmMsg" style="font-size:13.5px;line-height:1.6;white-space:pre-line"></p></div>
      <div class="m-foot">
        <button class="btn-ghost" id="confirmNao">Cancelar</button>
        <button class="btn-primary" id="confirmSim">Confirmar</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/js/chart.umd.js"></script>
  <script src="/js/vercel-blob-client.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
